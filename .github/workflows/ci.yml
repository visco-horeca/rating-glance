name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} lint
    runs-on: ubuntu-latest
    container: php:${{ matrix.php }}-cli
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - run: find . -name '*.php' -not -path './dist/*' -print0 | xargs -0 -n1 php -l

  build:
    name: Build zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/build-zip.sh
      - uses: actions/upload-artifact@v7
        with:
          name: rating-glance
          path: |
            dist/
            !dist/*.zip
